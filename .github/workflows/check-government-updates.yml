name: Check Government Updates

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check official sources
        run: node scripts/check-government-updates.mjs

      - name: Commit generated update files
        run: |
          if git diff --quiet -- data/government-updates-state.json data/government-updates.js; then
            echo "No official source changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/government-updates-state.json data/government-updates.js
          git commit -m "Atualiza monitoramento de fontes oficiais"
          git push
